name: Post-Close Market Data Ingestion

on:
  schedule:
    # Runs at 20:30 UTC (4:30 PM EST) Monday through Friday
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run Data Ingestion Script
        env:
          PYTHONPATH: .
        run: python scripts/post_close_ingest.py

      - name: Commit and Push Updated Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_snapshot.json
          git commit -m "Automated post-close data refresh [skip ci]" || exit 0
          git push
